<style>
/* Layout: one mobile app shell (max 440px), scrolling content, fixed bottom tab bar, bottom sheets for details. */

  --surface-2:#EFE9F3;

  --muted:#6F6479;
  --line:#E3DBE9;
  --accent:#B03A63;
  --accent-soft:#F7DDE6;
  --on-accent:#FFFFFF;
  --sage:#46775A;
  --sage-soft:#DCEBE0;
  --sun:#9A6416;
  --sun-soft:#F6E7CC;
  --sky:#3B669B;
  --sky-soft:#DCE6F3;
  --danger:#A6332B;
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:22px; --r-md:14px;
}
@media (prefers-color-scheme: dark){

    --accent:#EC7EA2; --accent-soft:#45202F; --on-accent:#2A0D19; --sage:#8FC6A0; --sage-soft:#20372A;
    --sun:#E3B061; --sun-soft:#3B2D16; --sky:#93B8E6; --sky-soft:#1E2B3D; --danger:#F08A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0F0B13; --bg:#17121C; --surface:#221B29; --surface-2:#2C2434; --ink:#F2EBF6; --muted:#A99DB4; --line:#3A3044;
  --accent:#EC7EA2; --accent-soft:#45202F; --on-accent:#2A0D19; --sage:#8FC6A0; --sage-soft:#20372A;
  --sun:#E3B061; --sun-soft:#3B2D16; --sky:#93B8E6; --sky-soft:#1E2B3D; --danger:#F08A80; color-scheme:dark;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-0.015em;line-height:1.15}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-0.02em}
.brand svg{width:22px;height:22px;color:var(--accent)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
main{flex:1;overflow-y:auto;padding:4px 16px 28px;display:flex;flex-direction:column;gap:14px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--surface-2)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.impulse{background:var(--accent);color:var(--on-accent);border-radius:var(--r-lg);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px}
.impulse .eyebrow{color:var(--on-accent);opacity:.8}
.impulse p.q{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-0.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);text-align:center}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{color:var(--accent);font-weight:700;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.t-sage{background:var(--sage-soft);color:var(--sage)}
.t-accent{background:var(--accent-soft);color:var(--accent)}

.t-sky{background:var(--sky-soft);color:var(--sky)}
.reco{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.reco:first-of-type{border-top:0;padding-top:2px}
.reco .txt{grid-column:1 / -1;font-size:14px;color:var(--muted)}
.reco h3{margin-top:4px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--surface);border-radius:var(--r-md);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.metric .lbl{font-size:12px;color:var(--muted);font-weight:600}
.metric .val{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--surface-2)}
.ring text{font-family:var(--font-display);font-weight:800;font-size:15px;fill:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-weight:700}
.bar{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:inherit;transition:width .4s}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .num{font-variant-numeric:tabular-nums;font-weight:700}
.x{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-weight:700;flex:none}
.foodgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.food{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);text-align:left}
.food b{font-size:13px;line-height:1.25}
.food span{font-size:12px;color:var(--muted)}
.food em{font-style:normal;font-weight:800;color:var(--sage);font-size:13px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:var(--r-md);background:var(--surface);text-align:left;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);text-align:center}
.day b{font-family:var(--font-display);font-size:13px;color:var(--ink)}
.day.today{outline:2px solid var(--accent)}
.day .dot{width:8px;height:8px;border-radius:50%;background:var(--surface-2)}
.day .dot.k{background:var(--sage)}
.day .dot.done{background:var(--accent)}
.ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{min-width:44px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--line);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.set.on{background:var(--sage);border-color:var(--sage);color:var(--bg)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:10px 0;border-radius:12px;background:var(--surface-2);font-weight:800;font-family:var(--font-display);font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);color:var(--on-accent)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.banner{border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--sun-soft);color:var(--ink)}
.banner b{color:var(--sun)}
.hotline{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.hotline span{color:var(--muted)}
.hotline b{font-variant-numeric:tabular-nums;user-select:all}
details.faq{border-top:1px solid var(--line);padding:12px 0}
details.faq:first-child{border-top:0}
details.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.faq summary::after{content:"+";color:var(--accent);font-weight:800}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:8px;color:var(--muted);font-size:14px}
textarea,input[type=text],input[type=number]{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.radio{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:left}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio span{font-size:13px;color:var(--muted)}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:22px;height:5px;border-radius:9px;background:var(--line)}
.progress-dots i.on{background:var(--accent)}

.pillar{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;text-align:center;color:var(--muted)}

.pillar svg{width:22px;height:22px}
.hero-ob{padding-block:14px 4px;display:flex;flex-direction:column;gap:12px}
.hero-ob h1{font-size:40px;line-height:1.02}
.hero-ob h1 em{font-style:normal;color:var(--accent)}
.disclaimer{font-size:12px;color:var(--muted);line-height:1.45}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
pre.report{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:14px;border-radius:12px;margin:0;max-height:46vh;overflow:auto;user-select:text}
.supp{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.supp:first-child{border-top:0}
.tick{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--bg)}
.tick.on{background:var(--sage);border-color:var(--sage)}
.tick svg{width:16px;height:16px}
.prog{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-md);background:var(--surface);text-align:left;min-width:0}
.prog .bar>i{background:var(--accent)}
/* Sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(20,12,26,.42)}
.sheet{position:relative;background:var(--bg);border-radius:26px 26px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .28s ease-out}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-body{overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* Breathing */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.orb{width:190px;height:190px;max-width:100%;border-radius:50%;display:grid;place-items:center;position:relative}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent-soft);transform:scale(var(--s,.55));transition:transform var(--d,1s) ease-in-out}
.orb span{position:relative;font-family:var(--font-display);font-weight:800;font-size:20px;text-align:center}
.orb small{display:block;font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--muted)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;text-align:center}
@media (prefers-reduced-motion: reduce){
  .orb::before{transition:none}
  .sheet{animation:none}
  .bar>i{transition:none}
}
</style>

</div>

function seedExamples(){
  const pattern = [[3,3,2,3,['Schlafstörung','Brain Fog']],[2,2,2,2,['Reizbarkeit','Nachtschweiß']],[3,3,3,3,['Hitzewallungen']],[4,3,4,4,[]],[2,2,1,2,['Schlafstörung','Dünnhäutigkeit','Kraftlosigkeit']],[3,4,3,3,['Hitzewallungen']],[4,4,4,4,[]],[3,2,2,3,['Nachtschweiß','Brain Fog']],[2,3,3,2,['Stimmungsschwankungen']],[3,3,3,3,['Gelenkschmerzen']],[4,4,3,4,['Hitzewallungen']],[3,2,2,2,['Schlafstörung','Reizbarkeit']],[4,4,4,3,[]]];
  for(let i=13;i>=1;i--){
    const p = pattern[13-i], k = dkey(daysAgo(i));
    S.checkins[k] = {mood:p[0], energy:p[1], sleep:p[2], focus:p[3], symptoms:p[4], period:S.profile.phase==='peri' && (i===11||i===10||i===9), ex:true};

  }
}

}

}

      ${recent.length?`<div class="list">${recent.map(j=>`<div class="li"><div class="grow small"><span class="eyebrow">${new Date(j.d).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</span><div style="white-space:pre-wrap">${esc(j.t)}</div></div></div>`).join('')}</div>`:''}
    </div>
    <div class="card">
      <h2>Fragen, die viele Frauen stellen</h2>
      <div>${FAQ.map(([q,a])=>`<details class="faq"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>
    </div>
    <div class="banner"><b>Wenn es zu viel wird</b><p class="small">Bei anhaltender Niedergeschlagenheit oder Gedanken, nicht mehr leben zu wollen, hol dir bitte sofort Unterstützung.</p><button class="link" style="text-align:left" data-a="help">Hilfe und Notfallnummern</button></div>`;
}
function openExercise(id){
  const e = EXERCISES[id];
  stopBreath();
  openSheet(e.n, ()=> e.breath ? `
    <p class="small">${e.intro}</p>
    <div class="breath">
      <div class="orb" id="orb"><span id="orb-label">Bereit?<small>${e.cycles} Runden · ${e.breath.map(b=>b[1]).join('-')}</small></span></div>
      <div class="row"><button class="btn accent" id="breath-btn" data-a="breath" data-v="${id}">Starten</button></div>
    </div>
    <p class="small muted">Gut für: ${e.for}</p>` : `
    <p class="small">${e.intro}</p>
    <div class="card" style="gap:0">${e.steps.map(([k,t])=>`<div class="li"><b style="font-family:var(--font-display);font-size:22px;color:var(--accent);width:24px">${k}</b><div class="grow small">${t}</div></div>`).join('')}</div>
    <p class="small muted">Gut für: ${e.for}</p>
    <button class="btn accent block" data-a="ex-done" data-v="${id}">Übung gemacht</button>`);
}
function stopBreath(){ if(breathTimer){ clearTimeout(breathTimer); breathTimer = null; } }
function runBreath(id){
  const e = EXERCISES[id], orb = document.getElementById('orb'), lbl = document.getElementById('orb-label'), btn = document.getElementById('breath-btn');
  if(breathTimer){ stopBreath(); btn.textContent = 'Starten'; orb.style.setProperty('--s','.55'); lbl.innerHTML = 'Pausiert'; return; }
  btn.textContent = 'Stopp';
  let cyc = 0, ph = 0, left = 0;
  const step = () => {
    if(left<=0){
      if(ph>=e.breath.length){ ph = 0; cyc++; }
      if(cyc>=e.cycles){ stopBreath(); orb.style.setProperty('--s','.55'); lbl.innerHTML = 'Geschafft.<small>Spür kurz nach.</small>'; btn.textContent = 'Nochmal'; markMental(id); return; }
      const [name, sec] = e.breath[ph];
      left = sec;
      orb.style.setProperty('--d', sec+'s');
      if(name==='Einatmen') orb.style.setProperty('--s','1');
      if(name==='Ausatmen') orb.style.setProperty('--s','.55');
      step.name = name; ph++;
    }
    lbl.innerHTML = `${step.name}<small>${left} · Runde ${cyc+1}/${e.cycles}</small>`;
    left--;
    breathTimer = setTimeout(step, 1000);
  };
  step();
}
function markMental(id){ const k = today(); S.mental[k] = [...new Set([...(S.mental[k]||[]), id])]; save(); }
function openProgram(id){
  const p = PROGRAMS[id];
  openSheet(p.n, ()=>{ const d = S.lessons[id]||[]; return `
    <p class="small muted">${p.sub}. Jede Einheit dauert etwa 5 Minuten und endet mit einer kleinen Aufgabe für den Alltag.</p>
    <div class="card" style="gap:0">${p.lessons.map((l,i)=>`<button class="li" style="text-align:left" data-a="lesson" data-v="${id}:${i}"><span class="tick ${d.includes(i)?'on':''}">${d.includes(i)?I.check:''}</span><div class="grow"><b>${i+1}. ${l[0]}</b></div><span class="link">Öffnen</span></button>`).join('')}</div>`; });
}
function openLesson(id, i){
  const p = PROGRAMS[id], l = p.lessons[i];
  openSheet(l[0], ()=>`
    <span class="eyebrow">${p.n} · Einheit ${i+1} von 4</span>
    <p>${l[1]}</p>
    <div class="card flat"><span class="eyebrow">Deine Aufgabe</span><p><b>${l[2]}</b></p></div>
    <button class="btn accent block" data-a="lesson-done" data-v="${id}:${i}">${(S.lessons[id]||[]).includes(i)?'Erledigt. Zurück zum Programm':'Einheit abschließen'}</button>`);
}

/* ---------- Körper (Verlauf, Supplements, Hormone, Profil) ---------- */
function last14(){ return [...Array(14)].map((_,i)=>{ const d = daysAgo(13-i); return {d, c:S.checkins[dkey(d)]}; }); }
function chart(days){
  const W=320,H=150,pl=20,pr=10,pt=10,pb=22, n=days.length;
  const x = i => pl+(W-pl-pr)*i/(n-1), y = v => pt+(H-pt-pb)*(5-v)/4;
  const series = [['mood','var(--accent)'],['energy','var(--sage)'],['sleep','var(--sky)']];
  let g = [1,2,3,4,5].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/>`).join('');
  g += [1,3,5].map(v=>`<text x="${pl-8}" y="${y(v)+3.5}" text-anchor="middle">${v}</text>`).join('');
  g += `<text x="${x(0)}" y="${H-6}" text-anchor="start">${shortDate(days[0].d)}</text><text x="${x(n-1)}" y="${H-6}" text-anchor="end">heute</text>`;
  series.forEach(([k,col])=>{
    let d = '', pen = false, last = null;
    days.forEach((dd,i)=>{ const v = dd.c && dd.c[k]; if(v){ d += (pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; pen = true; last = [x(i),y(v)]; } else pen = false; });
    if(d) g += `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(last) g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" style="fill:${col}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf von Stimmung, Energie und Schlaf über 14 Tage">${g}</svg></div>`;
}
function symptomCounts(days){
  const m = {}; days.forEach(d=>{ (d.c?.symptoms||[]).forEach(s=>m[s]=(m[s]||0)+1); });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function renderBody(){
  const days = last14(), logged = days.filter(d=>d.c).length, hasEx = days.some(d=>d.c?.ex);
  const counts = symptomCounts(days).slice(0,5), taken = S.supps[today()]||[];
  const mine = SUPPS.filter(s=>S.mySupps.includes(s.id));
  return `
    <div class="stack" style="gap:4px"><span class="eyebrow">Verlauf, Mikronährstoffe, Hormone</span><h1>Körper</h1></div>
    <div class="card">
      <div class="row between"><h2>Die letzten 14 Tage</h2><span class="small muted">${logged} Check-ins</span></div>
      ${chart(days)}
      <div class="legend"><span><i style="background:var(--accent)"></i>Stimmung</span><span><i style="background:var(--sage)"></i>Energie</span><span><i style="background:var(--sky)"></i>Schlaf</span></div>
      ${counts.length?`<div class="list">${counts.map(([s,n])=>`<div class="li small"><div class="grow">${s}</div><div style="width:40%" class="bar"><i style="width:${n/Math.max(1,logged)*100}%;background:var(--accent)"></i></div><span class="num" style="width:56px;text-align:right">${n} Tage</span></div>`).join('')}</div>`:''}
      ${hasEx?`<p class="small muted">Enthält Beispieldaten aus der Demo. Du kannst sie unten im Profil löschen.</p>`:''}
      <button class="btn accent" data-a="report">Für das Arztgespräch zusammenfassen</button>
    </div>
    <div class="card">
      <div class="row between"><h2>Meine Supplements</h2><span class="small muted">heute ${taken.filter(t=>S.mySupps.includes(t)).length}/${mine.length}</span></div>
      <div>${mine.length?mine.map(s=>`<div class="supp"><button class="tick ${taken.includes(s.id)?'on':''}" data-a="supp-take" data-v="${s.id}" aria-label="${s.n} genommen">${taken.includes(s.id)?I.check:''}</button><div class="grow" style="min-width:0"><b>${s.n}</b><div class="small muted">${s.dose}</div></div><button class="link" data-a="supp-info" data-v="${s.id}">Info</button></div>`).join(''):'<p class="small muted">Noch keine ausgewählt. Füge unten welche hinzu.</p>'}</div>
    </div>
    <div class="card flat">
      <h3>Mikronährstoffe für deine Phase</h3>
      <p class="small muted">Passend zur ${PHASES[S.profile.phase].name}. Orientierungswerte, keine Verordnung. Lass Blutwerte bestimmen und sprich die Einnahme mit Ärztin, Arzt oder Apotheke ab.</p>
      <div>${SUPPS.filter(s=>s.phases.includes(S.profile.phase)).map(s=>`<div class="supp"><div class="grow" style="min-width:0"><b>${s.n}</b><div class="small muted">${s.for}</div></div><button class="btn sm ${S.mySupps.includes(s.id)?'ghost':'line'}" data-a="supp-mine" data-v="${s.id}">${S.mySupps.includes(s.id)?'Entfernen':'Hinzufügen'}</button></div>`).join('')}</div>
    </div>
    <div class="card">
      <span class="eyebrow">Nur mit ärztlicher Beratung</span>
      <h2>Hormonersatztherapie verstehen</h2>
      <p class="small">Second Spring gibt keine Therapieempfehlung. Hier findest du verständliches Wissen, damit du gut vorbereitet ins Gespräch mit deiner Gynäkologin oder deinem Gynäkologen gehst.</p>
      <div>${HRT.map(([q,a])=>`<details class="faq"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>
    </div>
    <div class="card flat">
      <h3>Profil</h3>
      <div class="list small">
        <div class="li"><div class="grow">Name</div><b>${esc(S.profile.name)}</b></div>
        <div class="li"><div class="grow">Alter · Gewicht</div><b class="num">${S.profile.age} · ${S.profile.weight} kg</b></div>
        <div class="li"><div class="grow">Proteinziel</div><b class="num">${proteinGoal()} g pro Tag</b></div>
      </div>
      <div class="chips">${Object.entries(PHASES).map(([k,p])=>`<button class="chip ${S.profile.phase===k?'on':''}" data-a="phase" data-v="${k}">${p.name}</button>`).join('')}</div>
      <div class="row wrap">
        ${hasEx||Object.values(S.checkins).some(c=>c.ex)?`<button class="btn sm line" data-a="clear-ex">Beispieldaten löschen</button>`:''}
        <button class="btn sm ${confirmReset?'accent':'line'}" data-a="reset">${confirmReset?'Wirklich alles löschen?':'Demo zurücksetzen'}</button>
      </div>
    </div>`;
}
const HRT = [
  ['Was ist eine Hormonersatztherapie?','Sie ersetzt das sinkende Östrogen. Frauen mit Gebärmutter erhalten zusätzlich ein Gestagen, meist mikronisiertes Progesteron, zum Schutz der Gebärmutterschleimhaut. Fachlich heißt sie auch Menopausale Hormontherapie (MHT).'],
  ['Welche Formen gibt es?','Östrogen über die Haut als Gel, Pflaster oder Spray, oder als Tablette. Bei Scheidentrockenheit gibt es lokale vaginale Östrogene in niedriger Dosis. Die Form beeinflusst das Risikoprofil, etwa für Thrombosen.'],
  ['Wobei kann sie helfen?','Sie ist die wirksamste Behandlung gegen Hitzewallungen und Nachtschweiß, schützt die Knochen und kann Schlaf, Stimmung und Scheidentrockenheit verbessern.'],
  ['Was muss ärztlich geklärt werden?','Deine persönliche Vorgeschichte, zum Beispiel Brustkrebs in der Familie, Thrombosen, Lebererkrankungen oder Migräne mit Aura. Außerdem der Zeitpunkt: Das Nutzen-Risiko-Verhältnis ist meist am günstigsten bei Beginn vor 60 oder innerhalb von 10 Jahren nach der Menopause.'],
  ['Ist sie nicht gefährlich?','Eine große Studie aus dem Jahr 2002 hat viele Frauen verunsichert. Spätere Auswertungen zeigen ein differenzierteres Bild: Das Risiko hängt stark von Alter, Präparat, Form und Vorerkrankungen ab. Genau deshalb gehört die Entscheidung in ein ärztliches Gespräch.']
];
function openSupp(id){
  const s = SUPPS.find(x=>x.id===id);
  openSheet(s.n, ()=>`
    <div class="card" style="gap:0">
      <div class="li"><div class="grow small"><span class="eyebrow">Wofür</span><div>${s.for}</div></div></div>
      <div class="li"><div class="grow small"><span class="eyebrow">Orientierung</span><div>${s.dose}</div></div></div>
      <div class="li"><div class="grow small"><span class="eyebrow">Hinweis</span><div>${s.note}</div></div></div>
    </div>
    <p class="small muted">Keine Dosierungsempfehlung. Bitte mit Ärztin, Arzt oder Apotheke abstimmen.</p>`);
}
function buildReport(){
  const days = last14(), L = days.filter(d=>d.c), n = L.length;
  const avg = k => n ? fmt1(L.reduce((a,d)=>a+d.c[k],0)/n) : '–';
  const counts = symptomCounts(days), periods = L.filter(d=>d.c.period).length;
  const wk = days.filter(d=>(S.workouts[dkey(d.d)]||[]).some(w=>'ABC'.includes(w))).length;
  const supps = SUPPS.filter(s=>S.mySupps.includes(s.id)).map(s=>s.n).join(', ') || 'keine';
  return [
    'SECOND SPRING · Symptom-Übersicht für das Arztgespräch',
    '',
    `Name: ${S.profile.name}, ${S.profile.age} Jahre`,
    `Phase (Selbsteinschätzung): ${PHASES[S.profile.phase].name}`,
    `Zeitraum: ${shortDate(days[0].d)}–${shortDate(days[13].d)}${days[13].d.getFullYear()} (${n} Check-ins)`,
    L.some(d=>d.c.ex) ? '(enthält Beispieldaten aus der Demo)' : null,
    '',
    'Durchschnitt (1 = sehr schlecht, 5 = sehr gut)',
    `- Stimmung: ${avg('mood')}`,
    `- Energie: ${avg('energy')}`,
    `- Schlaf: ${avg('sleep')}`,
    `- Konzentration: ${avg('focus')}`,
    '',
    'Häufigste Beschwerden',
    ...(counts.length ? counts.slice(0,6).map(([s,c])=>`- ${s}: an ${c} von ${n} Tagen`) : ['- keine notiert']),
    '',
    ['peri','unsure'].includes(S.profile.phase) ? `Blutungen notiert: an ${periods} Tagen` : null,
    `Krafttraining: ${wk} Einheiten in 14 Tagen`,
    `Nahrungsergänzung: ${supps}`,
    '',
    'Meine Fragen',
    '- Kommt eine Hormonersatztherapie für mich in Frage? Welche Form?',
    '- Welche Blutwerte sind sinnvoll (Vitamin D, Ferritin, B12, Schilddrüse)?',
    '- Sollte ich eine Knochendichtemessung machen?',
    '- Was kann ich gegen Schlafprobleme und Stimmungsschwankungen tun?'
  ].filter(l=>l!==null).join('\n');
}

/* ---------- Sheet ---------- */
function openSheet(title, fn){
  sheetRender = fn;
  document.getElementById('sheet-title').textContent = title;
  document.getElementById('sheet-body').innerHTML = fn();
  document.getElementById('sheet').hidden = false;
  document.getElementById('sheet-body').scrollTop = 0;
}
function rerenderSheet(){ const b = document.getElementById('sheet-body'), s = b.scrollTop; b.innerHTML = sheetRender(); b.scrollTop = s; }
function closeSheet(){ stopBreath(); document.getElementById('sheet').hidden = true; sheetRender = null; }

/* ---------- Actions ---------- */
function go(v){
  const [k, a] = v.split(':');
  if(k==='tab'){ closeSheet(); S.tab = a; save(); render(); document.getElementById('main').scrollTop = 0; }
  else if(k==='checkin') openCheckin();
  else if(k==='workout') openWorkout(a);
  else if(k==='ex') openExercise(a);
  else if(k==='prog') openProgram(a);
  else if(k==='recipe') openRecipe(a);
}
function readOb(){
  const n = document.getElementById('ob-name'), a = document.getElementById('ob-age'), w = document.getElementById('ob-weight');
  if(n) ob.name = n.value.trim() || 'Du';
  if(a) ob.age = Math.min(90, Math.max(30, parseInt(a.value)||49));
  if(w) ob.weight = Math.min(200, Math.max(35, parseInt(w.value)||68));
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const a = el.dataset.a, v = el.dataset.v, tk = today();
  switch(a){
    case 'tab': S.tab = v; save(); render(); document.getElementById('main').scrollTop = 0; break;
    case 'go': go(v); break;
    case 'ob-next': readOb(); ob.step++; render(); break;
    case 'ob-back': readOb(); ob.step--; render(); break;
    case 'ob-phase': readOb(); ob.phase = v; render(); break;
    case 'ob-goal': ob.goals = ob.goals.includes(v) ? ob.goals.filter(g=>g!==v) : [...ob.goals, v]; render(); break;
    case 'ob-agree': ob.agree = el.checked; render(); break;
    case 'ob-finish':
      S.profile = {name:ob.name, age:ob.age, weight:ob.weight, phase:ob.phase, goals:ob.goals};
      seedExamples(); S.tab = 'heute'; save(); render(); break;
    case 'checkin': openCheckin(); break;
    case 'ci-scale': { const [k,n] = v.split(':'); draft[k] = +n; rerenderSheet(); break; }
    case 'ci-sym': draft.symptoms = draft.symptoms.includes(v) ? draft.symptoms.filter(s=>s!==v) : [...draft.symptoms, v]; rerenderSheet(); break;
    case 'ci-period': draft.period = el.checked; break;
    case 'ci-save': delete draft.ex; S.checkins[tk] = draft; save(); closeSheet(); S.tab = 'heute'; render(); toast('Gespeichert. Dein Tagesplan ist angepasst.'); break;
    case 'water': S.water[tk] = Math.max(0, Math.min(12, (S.water[tk]||0) + (+v))); save(); render(); break;
    case 'food-add': { const f = FOODS[+v]; (S.food[tk] = S.food[tk]||[]).push({n:f.n+' ('+f.a+')', p:f.p}); save(); render(); toast('+'+f.p+' g Protein'); break; }
    case 'food-del': S.food[tk].splice(+v,1); save(); render(); break;
    case 'recipe-log': { const r = RECIPES.find(x=>x.id===v); (S.food[tk] = S.food[tk]||[]).push({n:r.n, p:r.p}); save(); closeSheet(); render(); toast('+'+r.p+' g Protein eingetragen'); break; }
    case 'w-light': wDraft.light = el.checked; wDraft.done = {}; rerenderSheet(); break;
    case 'w-set': wDraft.done[v] = !wDraft.done[v]; rerenderSheet(); break;
    case 'w-done': S.workouts[tk] = [...new Set([...(S.workouts[tk]||[]), wDraft.id])]; save(); closeSheet(); render(); toast('Training gespeichert. Stark!'); break;
    case 'breath': runBreath(v); break;
    case 'ex-done': markMental(v); closeSheet(); toast('Gut gemacht. Kleine Pausen wirken.'); break;
    case 'lesson': { const [p,i] = v.split(':'); openLesson(p, +i); break; }
    case 'lesson-done': { const [p,i] = v.split(':'); S.lessons[p] = [...new Set([...(S.lessons[p]||[]), +i])]; save(); render(); openProgram(p); break; }
    case 'journal-save': { const t = document.getElementById('journal').value.trim(); if(!t){ toast('Schreib mindestens eine Sache auf.'); break; } S.journal.unshift({d:Date.now(), t}); save(); render(); toast('Gespeichert'); break; }
    case 'help': openSheet('Hilfe in der Krise', helpContent); break;
    case 'supp-take': { const l = S.supps[tk]||[]; S.supps[tk] = l.includes(v) ? l.filter(x=>x!==v) : [...l, v]; save(); render(); break; }
    case 'supp-mine': S.mySupps = S.mySupps.includes(v) ? S.mySupps.filter(x=>x!==v) : [...S.mySupps, v]; save(); render(); break;
    case 'supp-info': openSupp(v); break;
    case 'report': openSheet('Arztgespräch vorbereiten', ()=>`<p class="small muted">Diese Übersicht kannst du kopieren und zum Termin mitnehmen oder vorab per Mail schicken.</p><pre class="report" id="report">${esc(buildReport())}</pre><button class="btn accent block" data-a="copy">Text kopieren</button>`); break;
    case 'copy': {
      const pre = document.getElementById('report');
      const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text markiert. Jetzt kopieren.'); };
      try{ navigator.clipboard.writeText(pre.textContent).then(()=>toast('Kopiert'), sel); }catch(err){ sel(); }
      break; }
    case 'phase': S.profile.phase = v; save(); render(); break;
    case 'clear-ex': for(const k in S.checkins) if(S.checkins[k].ex){ delete S.checkins[k]; delete S.workouts[k]; } save(); render(); toast('Beispieldaten gelöscht'); break;
    case 'reset':
      if(!confirmReset){ confirmReset = true; render(); setTimeout(()=>{ if(confirmReset){ confirmReset = false; if(S.profile && S.tab==='koerper') render(); } }, 4000); break; }
      confirmReset = false; S = fresh(); ob.step = 0; ob.agree = false; save(); render(); break;
    case 'sheet-close': closeSheet(); break;
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
render();
</script>
